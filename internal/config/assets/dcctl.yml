# dcctl - Docker Compose Control
# https://github.com/hrodrig/dcctl
#
# One config, one command: get the full stack up for any environment. Great for onboarding (weeks → hours).
#
# Concept:
#   - You define named environments (default, uat, prod, fix, etc. — whatever you need).
#   - You choose which environment to use via the CLI (-e/--environment) or set default_environment here.
#   - Each environment lists the services (manifest names) to run for that environment.
#   - Manifests live at: <config_dir>/<environment>/<service>.yml
#     Example: same config dir, environment "uat" → uat/app.yml, uat/db.yml
#
# The environment named "default" must always exist. You can add more (uat, prod, fix, etc.).

schema_version: "1.0"
common:
  dcctl:
    verbose_level: 2  # 0=quiet, 1=normal, 2=verbose, 3=debug
  compose:
    ignore_orphans: true
    project_name: "dcctl"
dcctl:
  # Which environment to use when -e/--environment is not passed
  default_environment: "default"
  environments:
    default:
      services:
        - app
    # Add more environments as needed; each has its own list of manifest names
    # uat:
    #   services:
    #     - app
    #     - db
    # prod:
    #   services:
    #     - app
    #     - db
    #     - worker
