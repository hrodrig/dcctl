# dcctl config for example: counter + Redis
# Run from this directory: dcctl --config-file=dcctl.yml up

schema_version: "1.0"
common:
  dcctl:
    verbose_level: 2
  compose:
    ignore_orphans: true
    project_name: "dcctl-counter"
dcctl:
  default_environment: "default"
  environments:
    default:
      services:
        - stack
