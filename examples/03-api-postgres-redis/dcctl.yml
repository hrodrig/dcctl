# dcctl config for example: API + Postgres + Redis
# Run from repo root: dcctl --config-file=examples/03-api-postgres-redis/dcctl.yml up

schema_version: "1.0"
common:
  dcctl:
    verbose_level: 2
  compose:
    ignore_orphans: true
    project_name: "dcctl-api-pg-redis"
dcctl:
  default_environment: "default"
  environments:
    default:
      services:
        - stack
