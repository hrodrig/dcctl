# Minecraft server — from docker/awesome-compose (minecraft)
# https://github.com/docker/awesome-compose/tree/master/minecraft
services:
  minecraft:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
    deploy:
      resources:
        limits:
          memory: 1.5G
    volumes:
      - "./minecraft_data:/data"
