# API service — uses postgres + redis from databases.yml
# Same project (dcctl-fullstack) so all services share the default network
services:
  api:
    build: ../api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://app:secret@postgres:5432/appdb?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis
