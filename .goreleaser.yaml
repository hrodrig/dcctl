# GoReleaser config for dcctl
# https://goreleaser.com
# Release: merge develop → main, git tag v0.1.0, then make release
# Snapshot (no tag): make snapshot
# Release: merge develop → main, git tag, make release. Homebrew tap: homebrew-dcctl.

version: 2

builds:
  - id: dcctl
    main: ./cmd/dcctl
    binary: dcctl
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X dcctl/cmd/dcctl/root.buildVersion=v{{ .Version }}
      - -X dcctl/cmd/dcctl/root.buildCommit={{ .ShortCommit }}
      - -X dcctl/cmd/dcctl/root.buildDate={{ .Date }}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: default
    package_name: dcctl
    file_name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    description: Docker Compose Control - manage Compose stacks per environment
    vendor: "dcctl contributors"
    homepage: https://github.com/hrodrig/dcctl
    license: MIT
    formats:
      - deb
      - rpm
    builds:
      - dcctl

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: hrodrig
    name: dcctl

# Docker: use Dockerfile.release; goreleaser provides only linux/<arch>/dcctl in context
dockers_v2:
  - dockerfile: Dockerfile.release
    ids:
      - dcctl
    images:
      - ghcr.io/hrodrig/dcctl
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    build_args:
      VERSION: "v{{ .Version }}"
      COMMIT: "{{ .ShortCommit }}"
      BUILDDATE: "{{ .Date }}"
    labels:
      org.opencontainers.image.title: "dcctl"
      org.opencontainers.image.description: "Docker Compose Control - manage Compose stacks per environment"
      org.opencontainers.image.source: "https://github.com/hrodrig/dcctl"
      org.opencontainers.image.version: "{{ .Version }}"

# Homebrew: publish to tap so users can "brew install hrodrig/dcctl/dcctl"
# Create repo https://github.com/hrodrig/homebrew-dcctl first. For CI, set HOMEBREW_TAP_TOKEN (PAT with repo scope).
homebrew_casks:
  - name: dcctl
    directory: Casks
    homepage: "https://github.com/hrodrig/dcctl"
    description: "Docker Compose Control - manage Compose stacks per environment"
    repository:
      owner: hrodrig
      name: homebrew-dcctl
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    url:
      verified: "github.com/hrodrig/dcctl/"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dcctl"]
          end

